<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3728ed"><meta name="description" content="Guia de comunicação CALL 16:15. Propósito, setores, programação e produção em um só lugar."><title>CALL 16:15 • Time de comunicação</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="#inicio">CALL<span>16:15</span><small>COMUNICAÇÃO / 2026</small></a><nav><a href="#servir">Servir</a><a href="processos.html">Processos</a><a href="#setores">Setores</a><a href="#escala">Escala</a><a href="#cronograma">Cronograma</a><a href="#programacao">Programação</a><a href="#producao">Produção</a></nav><button id="edit">Editar planejamento ↗</button></header><main id="app"></main><footer><div class="footer-brand"><img src="assets/call1615-logo.png" alt="CALL 1615" width="65" height="72"><strong>CALL 16:15</strong></div><p>Ganhar. Treinar. Enviar.<br>Um time. Muitas lentes. A mesma missão.</p><a href="#inicio">Voltar ao início ↑</a></footer><div class="toast" role="status" id="toast"></div><dialog id="taskDialog"><form id="taskForm"><div class="eyebrow">CENTRAL DE PRODUÇÃO</div><h2>Uma nova entrega.</h2><label>Título<input name="title" required maxlength="160"></label><label>Setor<select name="sector"></select></label><label>Dia<select name="day"><option value="0">Informações e regras</option><option value="1">Dia 1 · Sexta</option><option value="2">Dia 2 · Sábado</option><option value="3">Dia 3 · Domingo</option><option value="4">Dia 4 · Segunda</option><option value="5">Dia 5 · Terça / Praça</option></select></label><label>Frente<select name="front"><option>Stories</option><option>Feed</option><option>Informações</option></select></label><label>Checks (um por linha)<textarea name="checkItems" rows="5"></textarea></label><label>Responsável da comunicação<input name="owner" placeholder="A definir"></label><label>Horário de captação (ou “A confirmar”)<input name="time" placeholder="Ex.: 10:30"></label><label>Prazo<input name="due" type="datetime-local"></label><label>Briefing<textarea name="brief" rows="4"></textarea></label><div class="actions"><button type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Adicionar entrega ↗</button></div></form></dialog><dialog id="scaleDialog"><form id="scaleForm"><div class="eyebrow">EDITAR ESCALA</div><h2>Dia, turno e equipe.</h2><label>Dia<select name="day"><option value="1">Sexta-feira</option><option value="2">Sábado</option><option value="3">Domingo</option><option value="4">Segunda-feira</option><option value="5">Terça-feira</option></select></label><label>Turno<select name="shift"><option>Manhã</option><option>Tarde</option><option>Noite</option></select></label><div id="scaleMemberFields"></div><div class="actions"><button type="button" id="deleteScale">Remover turno</button><button type="button" id="cancelScale">Cancelar</button><button class="primary" type="submit">Salvar escala ✓</button></div></form></dialog><dialog id="scheduleDialog"><form id="scheduleForm"><div class="eyebrow">CRONOGRAMA</div><h2>Editar momento.</h2><label>Dia<select name="day"><option value="1">Sexta</option><option value="2">Sábado</option><option value="3">Domingo</option><option value="4">Segunda</option><option value="5">Terça</option></select></label><label>Bloco / turno<input name="block" required placeholder="Ex.: SÁBADO - MANHÃ"></label><label>Horário<input name="time" required pattern="[0-2][0-9]:[0-5][0-9]" placeholder="08:00"></label><label>Momento<input name="title" required></label><label>Ministro / condução<input name="minister"></label><div class="actions"><button type="button" id="deleteSchedule">Remover momento</button><button type="button" id="cancelSchedule">Cancelar</button><button type="submit" class="primary">Salvar momento ✓</button></div></form></dialog><script src="cronograma.js"></script><script src="demandas.js"></script><script src="escalas.js"></script><script src="treinamento.js"></script><script src="app.js"></script></body></html>
